# cases/mushu/aircraft_model.toml
# All values in SI units.

# Inertia
[inertia]
mass = 9.398   # kg      — total mass
Ix   = 0.1945560079   # kg.m^2  — roll moment of inertia
Iy   = 0.4273647411   # kg.m^2  — pitch moment of inertia
Iz   = 0.5249720864   # kg.m^2  — yaw moment of inertia
Ixz  = 0.09489697883      # kg.m^2  — product of inertia (0 for symmetric aircraft)

# Wing geometry
[geometry]
S = 0.7973   # m^2   wing reference area
b = 1.9   # m     wingspan
c = 0.4209   # m     mean aerodynamic chord

# Propulsion
[propulsion]
arm_z_engine = -0.001   # m    vertical distance from CG to thrust line
                        #     negative = thrust line above CG

# Control surface deflection limits
[control_limits]
elevator_max = 25.0   # deg
aileron_max  = 20.0   # deg
rudder_max   = 30.0   # deg
brake_max    = 200.0  # N

# Aerodynamic tables
[aero]
tables_dir = "aero_tables"   # path relative to this file

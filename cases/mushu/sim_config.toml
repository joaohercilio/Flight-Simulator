[simulation]
t_start = 0.0
t_end = 15.0
dt = 0.01

[model]
file = "data/aircraft_model.dat"

[atmosphere]
model = "constant"
density = 1.1
gravity = 9.81

[trim]
trim_flight = true

[trimconditions]
mode = "glide"
v_des = 12.0
h_des = 800.0
gamma_des = 0.0
radiusdes = 35.0

[initial_condition]
u = 10.0
v = 0.0
w = 0.0
phi = 0.0
theta = 0.0
psi = -0.79
x_e = 0.0
y_e = 0.0
z_e = -800.0
p = 0.0
q = 0.0
r = 0.0

[plots]
save_figures = true
output_dir = "results/"
show_gui = true
